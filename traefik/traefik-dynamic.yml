# Traefik Dynamic Configuration
# Defines middlewares and other dynamic configuration

http:
  middlewares:
    authorize:
      forwardauth:
        address: "http://auth:8000/authorize"
        # These can easily be spoofed
        # Setting this to false tells traefik to set the correct headers
        # X-forwarded-for-* headers submitted by the client are discarded
        trustForwardHeader: false
        authResponseHeaders:
          - X-Forwarded-User
          - X-Forwarded-Roles
          - X-Analytics-Logged
    
    # Request tracking middleware for analytics
    request-tracker:
      headers:
        customRequestHeaders:
          X-Analytics-Enabled: "true"
        customResponseHeaders:
          X-Analytics-Processed: "true"
    
    # Rate limiting middleware for Cloudflared requests (stricter limits)
    cloudflared-rate-limit:
      rateLimit:
        average: 40        # More restrictive for cloudflared traffic
        period: "60s"
        burst: 80
        sourceCriterion:
          ipStrategy:
            depth: 1
    
    # Rate limiting middleware for direct HTTPS requests (port 443)
    local-rate-limit:
      rateLimit:
        average: 80        # Based on measured 62 req/min average + headroom
        period: "60s"
        burst: 150         # Based on measured 120 req/min burst + headroom
        sourceCriterion:
          ipStrategy:
            depth: 1
    
    # Rate limiting middleware specifically for login endpoints
    login-rate-limit:
      rateLimit:
        average: 3         # 3 requests per minute
        period: "60s"
        burst: 5           # Allow small burst for legitimate retries
        sourceCriterion:
          ipStrategy:
            depth: 1
    
    # Analytics middleware chain for comprehensive tracking
    analytics-chain:
      chain:
        middlewares:
          - request-tracker
          - authorize
          - local-rate-limit
    
    # Analytics chain for cloudflared traffic
    analytics-cloudflared-chain:
      chain:
        middlewares:
          - request-tracker
          - authorize
          - cloudflared-rate-limit
    