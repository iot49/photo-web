volumes:
  traefik-certs:
    driver: local
  auth-data:
    driver: local
  nginx-cache:
    driver: local
  traefik-logs:
    driver: local
  analytics-data:
    driver: local

networks:
  ingress:
    name: ingress   # traefik to proxied apps
  tunnel:
    name: tunnel    # cf tunnel to traefik

services:
  traefik:
    image: traefik:v3.1.5
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Internal port 81 for cloudflared (not exposed to host)
    env_file:
      - .env
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/traefik-dynamic.yml:/etc/traefik/traefik-dynamic.yml:ro
      - traefik-certs:/var/traefik/certs
      - traefik-logs:/var/log/traefik
    labels:
      - traefik.enable=true
      # Dashboard router (for UI)
      # TIP: would be nice to server at /traefik istead of subdomain. IT WON'T WORK!
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${ROOT_DOMAIN}`) && PathPrefix(`/`)
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=cloudflare
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.service=dashboard@internal
      - traefik.http.routers.traefik-dashboard.middlewares=authorize@file
      - traefik.http.routers.traefik-dashboard.priority=1
      # API router (for data endpoints)
      - traefik.http.routers.traefik-api.rule=Host(`traefik.${ROOT_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.traefik-api.tls=true
      - traefik.http.routers.traefik-api.tls.certresolver=cloudflare
      - traefik.http.routers.traefik-api.entrypoints=websecure
      - traefik.http.routers.traefik-api.service=api@internal
      - traefik.http.routers.traefik-api.middlewares=authorize@file
      - traefik.http.routers.traefik-api.priority=2
    networks:
      - ingress
      - tunnel
    depends_on:
      - nginx


  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./nginx/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro # static content
      - nginx-cache:/var/cache/nginx # cache volume
    labels:
      - "traefik.enable=true"
      # Route root domain and photos/auth paths through nginx (HTTPS - port 443)
      - "traefik.http.routers.nginx.rule=Host(`${ROOT_DOMAIN}`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls=true"
      - "traefik.http.routers.nginx.tls.certresolver=cloudflare"
      - "traefik.http.routers.nginx.priority=20"
      - "traefik.http.routers.nginx.middlewares=analytics-chain@file"
      # Internal unencrypted router for cloudflared (stricter rate limiting)
      - "traefik.http.routers.nginx-internal.rule=Host(`${ROOT_DOMAIN}`)"
      - "traefik.http.routers.nginx-internal.entrypoints=webinternal"
      - "traefik.http.routers.nginx-internal.priority=20"
      - "traefik.http.routers.nginx-internal.middlewares=analytics-cloudflared-chain@file"
      - "traefik.http.services.nginx.loadbalancer.server.port=80" # Default nginx port
    networks:
      - ingress
    depends_on:
      - photos
      - auth
      - files

  auth:
    build: ./auth
    image: auth-service:latest
    container_name: auth
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - auth-data:/app/data # SQLite database storage
      - analytics-data:/app/analytics # Analytics data storage
    labels:
      - "traefik.enable=true"
      # Unified route for login endpoint with strict rate limiting (both HTTPS and internal)
      - "traefik.http.routers.auth-login.rule=Host(`${ROOT_DOMAIN}`) && PathPrefix(`/auth/login`)"
      - "traefik.http.routers.auth-login.entrypoints=websecure,webinternal"
      - "traefik.http.routers.auth-login.tls=true"
      - "traefik.http.routers.auth-login.tls.certresolver=cloudflare"
      - "traefik.http.routers.auth-login.priority=100"  # Higher priority than nginx
      - "traefik.http.routers.auth-login.middlewares=login-rate-limit@file"
      - "traefik.http.routers.auth-login.service=auth-service"
      # Service definition
      - "traefik.http.services.auth-service.loadbalancer.server.port=8000"
    networks:
      - ingress  # Added for traefik middleware access
      
  photos:
    build: ./photos/app
    image: photos-service:latest
    container_name: photos
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # IMPORTANT: give Docker and Terminal "Full Disk Access" in System Preferences/Privacy & Security
      - ${PHOTOS_LIBRARY}:/photo_db:ro
      - nginx-cache:/var/cache/nginx # access to nginx cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp/imagemagick:/tmp/imagemagick # shared volume for ImageMagick processing
    # No direct Traefik labels - accessed through nginx proxy
    networks:
      - ingress
    depends_on:
      - imagemagick

  imagemagick:
    image: dpokidov/imagemagick:latest
    container_name: imagemagick
    restart: unless-stopped
    volumes:
      - /tmp/imagemagick:/images
      - ${PHOTOS_LIBRARY}:/photo_db:ro
    # This service will be called by the photos service for image processing
    # No external access needed
    networks:
      - ingress
    # Keep container running for service calls - override entrypoint
    entrypoint: ["tail", "-f", "/dev/null"]

  files:
    build: ./files/app
    image: files-service:latest
    container_name: files
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${FILES}:/docs:ro
    # No direct Traefik labels - accessed through nginx proxy
    networks:
      - ingress
      
  cloudflared:
    # Setup:
    # - Set CF_TUNNEL_TOKEN in .env
    # - Configure cloudflare to forward requests to http://traefik:81 (not 80!)
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - tunnel
    depends_on:
      - traefik
    labels:
      - "traefik.enable=false"  # This service doesn't need traefik routing

  analytics:
    build: ./analytics
    image: analytics-service:latest
    container_name: analytics
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - traefik-logs:/logs/traefik:ro
      - analytics-data:/app/data
      - ./analytics:/app/src:ro
    networks:
      - ingress
    depends_on:
      - traefik
      - auth
    labels:
      - "traefik.enable=false"  # Internal service only